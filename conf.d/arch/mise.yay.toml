[bootstrap.files."/etc/pacman.conf"]
  phase = "pre-packages"
  content = '''
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
'''

[bootstrap.hooks.pre-packages]
  description = "Install yay (AUR helper) if missing"
  run         = ["sudo pacman -Sy", "bash {{ config_root }}/mise-tasks/yay-install"]
