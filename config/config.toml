[settings.history]
  fetch_interval   = "30s"
  sync_interval    = "30s"
  describe_command = "claude -p --output-format text --no-session-persistence 'Describe this change to my configuration files in one line of at most 120 characters, plain text, no quotes.'"

[tools]
  claude   = "latest"
  opencode = { version = "latest", allow_builds = ["@opencode/cli"] }

[dotfiles]
  "~/.config/mise" = { mode = "track" }

[history]
  git_email = "mise@{hostname}"

[bootstrap.mise_shell_activate]
  bash = true
  zsh  = true
  fish = "auto"

[bootstrap.services.mise-history]
  builtin = "history-watch"

[bootstrap.services.mise-tool-update]
  builtin = "tool-update"

[bootstrap.users.kjm]
  create_home = true
  group = "kjm"
  groups = [
    "wheel",
    "input",
    "video",
    "scanner",
    # "greeter",
    # "docker",
    # "i2c"
  ]

[bootstrap.user]
  login_shell = "fish"

[bootstrap.files."/etc/sudoers.d/wheel"]
  content = "%wheel ALL=(ALL:ALL) NOPASSWD: ALL"
  mode    = "0440"
  os      = "linux"

[bootstrap.packages]
  man-db    = "latest"
  man-pages = "latest"
  git       = "latest"
  wget      = "latest"
  curl      = "latest"
  snapper   = "latest"
  openssh   = "latest"
  fish      = "latest"
