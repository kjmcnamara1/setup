[settings.history]
  fetch_interval = "30s"
  sync_interval  = "30s"

[tools]
  claude   = "latest"
  opencode = { version = "latest", allow_builds = ["@opencode/cli"] }

[dotfiles]
  "~/.config/mise" = { mode = "track" }

[history]
  git_email = "mise@{hostname}"

[bootstrap.mise_shell_activate]
  bash = true
  zsh  = true
  fish = "auto"

[bootstrap.services.mise-history]
  builtin = "history-watch"

[bootstrap.users.kjm]
  create_home = true
  group = "kjm"
  groups = [
    "wheel",
    "input",
    "video",
    "scanner",
    # "greeter",
    # "docker",
    # "i2c"
  ]

[bootstrap.user]
  login_shell = "fish"

[bootstrap.files."/etc/sudoers.d/wheel"]
  content = "%wheel ALL=(ALL:ALL) NOPASSWD: ALL"
  mode    = "0440"
  os      = "linux"

[bootstrap.packages]
  base-devel     = "latest"
  pacman-contrib = "latest"
  git            = "latest"
  openssh        = "latest"
  fish           = "latest"
