[bootstrap.packages]
  udiskie = "latest"

[bootstrap.linux.systemd.units.udiskie]
  description = "Auto mount USB devices"
  # documentation = "man:udiskie(8)"
  after       = ["graphical-session.target"]
  type        = "simple"
  exec_start  = "/usr/bin/udiskie"
  restart     = "always"
  restart_sec = "2"
