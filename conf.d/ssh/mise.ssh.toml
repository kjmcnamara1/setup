[bootstrap.packages]
  openssh = "latest"

[dotfiles]
  "~/.ssh/aur"        = { mode = "fnox", depends = ["~/.config/fnox"] }
  "~/.ssh/github"     = { mode = "fnox", depends = ["~/.config/fnox"] }
  "~/.ssh/config"     = "files/config"
  "~/.ssh/aur.pub"    = "files/aur.pub"
  "~/.ssh/github.pub" = "files/github.pub"

