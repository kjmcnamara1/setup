
[bootstrap.groups.media]

# NAS files are owned 1000:3000 (group-writable).
[bootstrap.groups.nas]
  gid = 3000

[bootstrap.users.media]
  group  = "media"
  uid    = 1000
  groups = ["nas"]

[bootstrap.directories."/etc/sddm.conf.d"]

[bootstrap.files."/etc/sddm.conf.d/autologin.conf"]
  notify = ["sddm"]
  content = '''
[Autologin]
User=media
Session=plasma-bigscreen-wayland.desktop
Relogin=true
'''

[bootstrap.services.sddm]
  state   = "running"
  enabled = true

[bootstrap.packages]
  sddm                    = "latest"
  plasma-bigscreen        = "latest"
  wezterm                 = "latest"
  ttf-jetbrains-mono-nerd = "latest"
  plezy                   = "latest"
  imv                     = "latest"
  mpv                     = "latest"
  "aur:brave-origin-bin"  = "latest"
  "aur:localsend-bin"     = "latest"
  "aur:vacuumtube-bin"    = "latest"

  # graphics (Intel) — Vulkan for the standalone emulators, lib32 for Steam
  mesa               = "latest"
  vulkan-intel       = "latest"
  intel-media-driver = "latest"
  lib32-mesa         = "latest"
  lib32-vulkan-intel = "latest"

  # front-end + RetroArch (cores: Batocera defaults where packaged)
  "aur:emulationstation-de" = "latest"
  retroarch                 = "latest"
  retroarch-assets-xmb      = "latest"
  libretro-core-info        = "latest"
  libretro-nestopia         = "latest"
  libretro-snes9x           = "latest"
  libretro-gambatte         = "latest"
  libretro-mgba             = "latest"
  libretro-genesis-plus-gx  = "latest"
  libretro-mupen64plus-next = "latest"
  libretro-beetle-psx-hw    = "latest"
  libretro-melonds          = "latest"

  # standalone emulators (heavy ones are best-effort on Intel graphics)
  ppsspp                 = "latest"
  dolphin-emu            = "latest"
  "aur:pcsx2-latest-bin" = "latest"
  "aur:cemu-bin"         = "latest"
  "aur:rpcs3-bin"        = "latest"
  "aur:ryujinx-bin"      = "latest"
  "aur:azahar"           = "latest"
  "aur:xemu-bin"         = "latest"
  "aur:shadps4-bin"      = "latest"
  "aur:xenia-canary-bin" = "latest"
  steam                  = "latest"

  # sync / mirror / backup tooling
  nextcloud-client = "latest"
  rsync            = "latest"
  unzip            = "latest"
