[bootstrap.hooks.pre-packages]
  description = "Install yay (AUR helper) if missing"
  run = '''
if ! command -v yay >/dev/null; then
  sudo pacman -S --needed --noconfirm git base-devel
  tmp=$(mktemp -d)
  git clone --depth 1 https://aur.archlinux.org/yay-bin.git "$tmp/yay-bin"
  (cd "$tmp/yay-bin" && makepkg -si --noconfirm)
  rm -rf "$tmp"
fi
'''

[bootstrap.packages]
  base-devel     = "latest"
  pacman-contrib = "latest"
  btrfs-progs    = "latest"
  plymouth       = "latest" # boot module? plymouth,uki,systemd-boot,efibootmgr,snapper
  snapper        = "latest"
  snap-pac       = "latest"
  ntfs-3g        = "latest"
  reflector      = "latest" # reflector module? with /etc/xdg/reflector/reflector.conf
  zram-generator = "latest"
  efibootmgr     = "latest"
  sudo           = "latest"
  dosfstools     = "latest"
  mtools         = "latest"
  udiskie        = "latest"
  wl-clipboard   = "latest"

  # chaotic AUR?

[bootstrap.services.udiskie]
  scope = "user"
