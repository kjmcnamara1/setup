[bootstrap.packages]
  dms-shell             = "latest"
  quickshell            = "latest"
  matugen               = "latest"
  niri                  = "latest"
  dux-greeter-bin       = "latest"
  dsearch-bin           = "latest"
  qt6-multimedia        = "latest"
  cava                  = "latest"
  power-profiles-daemon = "latest"
  cups-pk-helper        = "latest"
  qt6-imageformats      = "latest"
  kimageformats         = "latest"
  i2c-tools             = "latest"
  fprintd               = "latest"

  wl-clipboard = "latest"
  uwsm         = "latest"

  grim    = "latest"
  slurp   = "latest"
  tensaku = "latest"
  pinta   = "latest"

  ddcutil    = "latest"
  kdeconnect = "latest"

  # OCR tool
  tesseract          = "latest" # core
  tesseract-data-eng = "latest" # English lang
  tesseract-data-osd = "latest" # Detects orientation of text
  zbar               = "latest" # QR code reader

  nautilus         = "latest"
  nautilus-python  = "latest"
  ghostty-nautilus = "latest"
  sshfs            = "latest"
  # gvfs             = "latest"
  # gvfs-smb         = "latest"
  # gvfs-nfs         = "latest"
  # gvfs-google      = "latest"
  # gvfs-onedrive    = "latest"

  gnome-disk-utility = "latest"
  adw-gtk-theme      = "latest"
  papirus-icon-theme = "latest"
  nordzy-cursors     = "latest"

[bootstrap.files."~/.config/systemd/user/niri.service.d/dms.conf"]
  content = """
[Unit]
Wants=dms.service
"""

[bootstrap.files."/etc/pam.d/greetd"]
  content = """
#%PAM-1.0

auth       required     pam_securetty.so
auth       requisite    pam_nologin.so
auth       include      system-local-login
auth       optional     pam_gnome_keyring.so
account    include      system-local-login
session    include      system-local-login
session    optional     pam_gnome_keyring.so auto_start
"""
[bootstrap.services.dms]
  scope = "user"
