[settings.history]
  fetch_interval   = "30s"
  sync_interval    = "30s"
  describe_command = "claude -p --output-format text --no-session-persistence 'Describe this change to my configuration files in one line of at most 120 characters, plain text, no quotes.'"

[history]
  git_email = "mise@{hostname}"

# https://mise.jdx.dev/bootstrap.html#how-it-runs
# 1. accounts
[bootstrap.groups.kjm]

[bootstrap.users.kjm]
  create_home = true
  group = "kjm"
  groups = [
    "wheel",
    "input",
    "video",
    "scanner",
    # "greeter",
    # "docker",
    # "i2c"
  ]

  # 2. plugins

  # 3. files phase = "pre-packages"

# 4. packages
[bootstrap.packages]
  man-db       = "latest"
  man-pages    = "latest"
  git          = "latest"
  wget         = "latest"
  curl         = "latest"
  openssh      = "latest"
  fish         = "latest"
  bat          = "latest"
  eza          = "latest"
  jq           = "latest"
  starship     = "latest"
  fd           = "latest"
  ripgrep      = "latest"
  fzf          = "latest"
  television   = "latest"
  zoxide       = "latest"
  pv           = "latest"
  tldr         = "latest"
  fastfetch    = "latest"
  bonsai       = "latest"
  gum          = "latest"
  bottom       = "latest"
  rocm-smi-lib = "latest"
  # silicon        = "latest"
  # vhs            = "latest"
  # asciinema      = "latest"
  # asciinema-edit = "latest"
  # asciinema-agg  = "latest"

# 5. files phase = "post-packages"
[bootstrap.files."/etc/sudoers.d/wheel"]
  content = "%wheel ALL=(ALL:ALL) NOPASSWD: ALL"
  mode    = "0440"
  os      = "linux"

# 6. services w/o requires_tools = true
[bootstrap.services.mise-history]
  builtin = "history-watch"

[bootstrap.services.mise-tool-update]
  builtin = "tool-update"

  # 7. firewall

  # 8. compose

  # 9. repos

# 10. dotfiles
[dotfiles]
  "~/.config/mise" = { mode = "track" }

# 11. mise-shell-activate
[bootstrap.mise_shell_activate]
  bash = true
  zsh  = true
  fish = "auto"

  # 12. macos-defaults

  # 13. macos-launchd-agents

  # 14. linux-systemd-units

# 15. user
[bootstrap.user]
  login_shell = "fish"

# 16. tools
[tools]
  claude   = "latest"
  opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
  herdr    = "latest"
  cliamp   = "latest"
  uv       = "latest"
  pixi     = "latest"
  yt-dlp   = "latest"

  # 17. packages from package manager plugins

  # 18. settings through bootstrap settings plugins

  # 19. services with requires_tools = true

  # 20. task [tasks.bootstrap]

  # 21. final-hook
