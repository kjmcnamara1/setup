[bootstrap.packages]
  networkmanager = "latest"
  iwd            = "latest"

[bootstrap.files."/etc/NetworkManager/conf.d/wifi_backend.conf"]
  content = """
[device]
wifi.backend=iwd
"""

[bootstrap.files."/etc/iwd/main.conf"]
  content = """
[Rank]
BandModifier6GHz=2.0
BandModifier5GHz=1.5
BandModifier2_4GHz=0.5
"""
